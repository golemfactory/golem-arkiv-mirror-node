[package]
name = "arkiv-db-redb"
description = "redb adapter for the Arkiv DB versioned storage contract, with instrumented and crash-simulating backends"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
alloy-primitives.workspace = true
arkiv-db-storage.workspace = true
redb.workspace = true

[dev-dependencies]
arkiv-db.workspace = true
# The tests and examples use this crate's own `testing` module.
arkiv-db-redb = { workspace = true, features = ["testing"] }

[features]
# `CrashDisk`, the simulated device of the crash and disk-full tests.
testing = ["arkiv-db-storage/testing"]

[lints]
workspace = true

[[example]]
name = "redb_experiment"
required-features = ["testing"]
